name: agent_bot
channels:
  - conda-forge
  - nodefaults

installers:
  ffmpeg:
    apt: ffmpeg
    pacman: ffmpeg
    dnf: ffmpeg
    yum: ffmpeg
  deno: # TODO: verify this
    apt: deno
    pacman: deno
    dnf: deno
    yum: deno

dependencies:
  - python=3.12
  - ffmpeg
  - deno
  - pip:
    - python-dotenv==1.2.2
    - PyYAML==6.0.3
    - py-cord[voice]==2.8.1
    - pydantic==2.13.4
    - yt-dlp[default]==2026.8.19
    - numpy==2.5.1
    - openai==2.45.0
    - exa_py==2.18.1